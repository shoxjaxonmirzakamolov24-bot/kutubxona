databases:
  - name: medical-learning-db
    databaseName: medical_learning
    user: kuaf

services:
  - type: web
    name: medical-learning
    runtime: node
    plan: free
    buildCommand: >
      pnpm install --frozen-lockfile &&
      PORT=3000 BASE_PATH=/ NODE_ENV=production
      pnpm --filter @workspace/medical-learning run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: bash scripts/render-start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medical-learning-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: book-uploads
      mountPath: /var/data
      sizeGB: 10
