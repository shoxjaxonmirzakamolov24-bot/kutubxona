kind = "web"
previewPath = "/"
title = "Medical Learning Platform"
version = "1.0.0"
id = "artifacts/medical-learning"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19555

[services.development]
run = "pnpm --filter @workspace/medical-learning run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medical-learning", "run", "build" ]
publicDir = "artifacts/medical-learning/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19555"
BASE_PATH = "/"
